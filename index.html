<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSuper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <h1 class="logo">CINESUPER</h1>
  </header>

  <main>
    <input id="search" class="search" type="text" placeholder="Search movies...">
    <div id="filters" class="filters">
  <button class="filter-btn active" data-lang="All">All</button>
  <button class="filter-btn" data-lang="Malayalam">Malayalam</button>
  <button class="filter-btn" data-lang="Tamil">Tamil</button>
  <button class="filter-btn" data-lang="English">English</button>
</div>
    <div id="movie-grid" class="movie-grid"></div>
    <div id="detail" class="detail hidden">
  <div class="detail-box">
    <button id="detail-close" class="detail-close">&times;</button>
    <div id="detail-content"></div>
  </div>
</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
  <script src="app.js"></script>
</body>
</html>
